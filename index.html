<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edlawit Heart</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const c=document.getElementById("c"),x=c.getContext("2d");
function rs(){c.width=innerWidth;c.height=innerHeight} rs(); onresize=rs;

let pts=[];
for(let t=0;t<Math.PI*2;t+=0.045){
  let hx=16*Math.pow(Math.sin(t),3);
  let hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  for(let z=-10;z<=10;z+=1.4) pts.push({x:hx,y:hy,z});
}

function rot(p,a){
 let s=Math.sin(a), co=Math.cos(a);
 return {x:p.x*co-p.z*s,y:p.y,z:p.x*s+p.z*co};
}

function draw(tm){
 x.fillStyle="rgba(0,0,0,.18)";
 x.fillRect(0,0,c.width,c.height);

 let ang=tm*0.0014;

 pts.forEach(p=>{
   let r=rot(p,ang);
   let scale=14+(r.z+10)*1.15;
   let px=c.width/2+r.x*scale;
   let py=c.height/2+r.y*scale;

   x.save();
   x.translate(px,py);
   x.rotate(ang);
   x.fillStyle="rgb(255,20,20)";
   x.font=`${Math.max(10,scale*.25)}px Arial`;
   x.fillText("I love you",0,0);
   x.restore();
 });

 x.fillStyle="white";
 x.font="bold 40px Arial";
 x.textAlign="center";
 x.fillText("Edlawit", c.width/2, c.height/2+10);

 requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
